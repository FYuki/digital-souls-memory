[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "digital-souls-memory"
version = "0.1.0"
description = "Independent memory service for the Digital Souls conversation runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.11.9",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-socket==0.7.0",
  "ruff==0.13.2",
]

[project.scripts]
memory-evaluate-retrieval = "digital_souls_memory.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_souls_memory"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --disable-socket --allow-unix-socket -m 'not it2 and not st'"
markers = [
  "ut: isolated unit tests without network",
  "it1: in-process integration with fakes, without network",
  "postgres: disposable real PostgreSQL with synthetic data only",
  "it2: explicitly approved real-model integration (not run in CI)",
  "st: Compose HTTP end-to-end tests (not run in CI)",
]
